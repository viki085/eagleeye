# Laptop override for compose.demo.yml: run the containerised services against the local stack
# (Supabase on the host, and the redis / qdrant / seaweedfs / warehouse containers from
# infra/docker-compose.yml) instead of their own Redis and an empty warehouse. Analysis runs in
# the Lambda sandbox image through the local Lambda emulator, as it will on AWS.
#
#   docker build -f infra/sandbox/Dockerfile.lambda -t eagleeye-sandbox-lambda:1 infra/sandbox
#   scripts\stop.cmd                       (stop the laptop API, gateway and workers first)
#   export EAGLEEYE_ENV_FILE=../../.env    (the repo .env, relative to this folder)
#   export WAREHOUSE_ADMIN_PASSWORD=unused (the warehouse service is off here, but Compose
#                                           still requires its variables)
#   docker compose -f infra/cloud/compose.demo.yml -f infra/cloud/compose.local.yml \
#     --env-file .env up -d
#   (stop.cmd also stops the web app: start it again with `npm run dev` in apps/web.
#    Afterwards, `... down` and scripts\start.cmd return the laptop to normal.)
#
# The repo's .env is read by Docker itself; only the local addresses are replaced here.
x-local-lambda: &local-lambda
  SANDBOX_BACKEND: lambda
  SANDBOX_LAMBDA_ENDPOINT_URL: http://sandbox:8080
  SANDBOX_LAMBDA_FUNCTION: function  # the emulator's name for its one function
  SANDBOX_TRANSFER_ENDPOINT_URL: http://seaweedfs:8333  # links the function can reach

services:
  api: &local
    env_file: ../../.env
    networks: [default, infra]
    environment:
      <<: *local-lambda
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://seaweedfs:8333
      WAREHOUSE_DSN: postgresql://eagleeye_ro:eagleeye-ro-local@warehouse:5432/warehouse
      SERVICE: api
    depends_on: !reset []
  gateway:
    <<: *local
    depends_on: !reset []
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      WAREHOUSE_DSN: postgresql://eagleeye_ro:eagleeye-ro-local@warehouse:5432/warehouse
      S3_ENDPOINT_URL: http://seaweedfs:8333  # query results are stored as artifacts
      SERVICE: gateway
  agent-worker:
    <<: *local
    depends_on: !reset []
    environment:
      <<: *local-lambda
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://seaweedfs:8333
      SERVICE: agent-worker
  ingest-worker:
    <<: *local
    depends_on: !reset []
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://seaweedfs:8333
      SERVICE: ingest-worker
  # the analysis sandbox as on AWS Lambda: read-only root, non-root, memory cap
  sandbox:
    image: eagleeye-sandbox-lambda:1
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,size=512m,mode=1777"]
    mem_limit: 2560m
    networks: [infra]
    restart: unless-stopped
  # the local stack already has these
  redis: { profiles: [cloud-only] }
  warehouse: { profiles: [cloud-only] }

networks:
  infra:
    name: eagleeye_default
    external: true
