[project]
name = "eagleeye-llm"
version = "0.1.0"
description = "LLMGateway port + LiteLLM adapter (provider-agnostic model tiers)"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "litellm>=1.55",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_llm"]
