[project]
name = "eagleeye-charts"
version = "0.1.0"
description = "Chart intent -> validated Vega-Lite spec, with data aggregated in code"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-datasets",
    "duckdb>=2.0",
    "pyarrow>=17",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
eagleeye-datasets = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_charts"]
