[project]
name = "eagleeye-catalog"
version = "0.1.0"
description = "Semantic catalog for text-to-SQL: introspection, curation, grants, retrieval"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-llm",
    "eagleeye-sqlsafe",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-llm = { workspace = true }
eagleeye-sqlsafe = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_catalog"]
