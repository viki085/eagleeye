[project]
name = "eagleeye-sandbox"
version = "0.1.0"
description = "Analysis sandbox: static checks + Docker executor for model-written SQL/Python"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-sqlsafe",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyarrow>=17",
]

[tool.uv.sources]
eagleeye-sqlsafe = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_sandbox"]
