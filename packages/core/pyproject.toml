[project]
name = "eagleeye-core"
version = "0.1.0"
description = "EagleEye shared domain models, config, and ports"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_core"]
