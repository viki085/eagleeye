[project]
name = "eagleeye-agents"
version = "0.1.0"
description = "Agent graph (C3): guard -> router -> simple | RAG | supervisor -> checks -> finalize"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-llm",
    "eagleeye-retrieval",
    "eagleeye-events",
    "asyncpg>=0.30",
    "langgraph>=0.2.60",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-llm = { workspace = true }
eagleeye-retrieval = { workspace = true }
eagleeye-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_agents"]
