[project]
name = "eagleeye-retrieval"
version = "0.1.0"
description = "Hybrid retrieval (Qdrant + pgvector + tsvector, RRF) with access filtering"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-llm",
    "asyncpg>=0.30",
    "qdrant-client>=1.20,<1.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_retrieval"]
