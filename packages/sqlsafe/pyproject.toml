[project]
name = "eagleeye-sqlsafe"
version = "0.1.0"
description = "Deterministic SQL validator/rewriter (sqlglot AST): read-only, granted tables only"
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_sqlsafe"]
