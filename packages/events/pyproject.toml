[project]
name = "eagleeye-events"
version = "0.1.0"
description = "Run event vocabulary + Redis Stream sink/reader (single writer per run)"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_events"]
