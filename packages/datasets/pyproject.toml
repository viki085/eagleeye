[project]
name = "eagleeye-datasets"
version = "0.1.0"
description = "Tabular datasets: CSV/XLSX to Parquet, automatic profile, table artifacts"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "asyncpg>=0.30",
    "duckdb>=2.0",
    "pyarrow>=17",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pandas>=2.2",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eagleeye_datasets"]
