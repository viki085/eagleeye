# Checks every push and pull request (Phase 7A step 7). Runs without live services: tests that
# need the database, warehouse, Docker sandbox or Lambda emulator skip themselves when absent.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.3"
          python-version: "3.12"
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --all-groups --frozen
      - name: Ruff
        run: uvx ruff@0.15.7 check .
      - name: Tests
        run: |
          set -euo pipefail
          for dir in apps/api apps/data-gateway apps/ingest-worker \
                     packages/agents packages/catalog packages/charts packages/core \
                     packages/datasets packages/events packages/llm packages/retrieval \
                     packages/sandbox packages/sqlsafe infra/terraform/base/lambda/wake; do
            echo "::group::$dir"
            (cd "$dir" && uv run --frozen pytest -q -p no:cacheprovider)
            echo "::endgroup::"
          done

  web:
    name: Web lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          # A placeholder in Clerk's public-key format (pk_test_ + base64 of a made-up
          # domain): the build only needs the shape. Not a secret; no real key is used in CI.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA # gitleaks:allow

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history, not just the last commit
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --no-banner --redact
