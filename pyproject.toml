[tool.uv.workspace]
members = [
    "apps/agent-worker",
    "apps/api",
    "apps/data-gateway",
    "apps/ingest-worker",
    "packages/agents",
    "packages/catalog",
    "packages/charts",
    "packages/core",
    "packages/datasets",
    "packages/events",
    "packages/llm",
    "packages/retrieval",
    "packages/sandbox",
    "packages/sqlsafe",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# offline data generators and operator scripts: long reference-data lines, fixed SQL and URLs
"infra/warehouse/**" = ["E501", "S608", "B905", "UP017", "B007"]
"data/**" = ["E501", "S608", "S310", "S324", "B905"]
"scripts/**" = ["E501", "S310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
markers = [
    "integration: needs live local services (Docker sandbox image, warehouse); skipped when absent",
]
