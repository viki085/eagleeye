[tool.uv.workspace]
members = [
    "apps/agent-worker",
    "apps/api",
    "apps/data-gateway",
    "apps/ingest-worker",
    "packages/agents",
    "packages/catalog",
    "packages/core",
    "packages/events",
    "packages/llm",
    "packages/retrieval",
    "packages/sqlsafe",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
