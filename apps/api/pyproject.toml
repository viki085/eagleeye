[project]
name = "eagleeye-api"
version = "0.1.0"
description = "EagleEye API service: REST + SSE"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-llm",
    "eagleeye-retrieval",
    "eagleeye-events",
    "eagleeye-catalog",
    "pyarrow>=17.0",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-llm = { workspace = true }
eagleeye-retrieval = { workspace = true }
eagleeye-events = { workspace = true }
eagleeye-catalog = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
