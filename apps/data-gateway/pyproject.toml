[project]
name = "eagleeye-data-gateway"
version = "0.1.0"
description = "Internal SQL executor: re-validates, runs read-only queries, stores Parquet artifacts"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-sqlsafe",
    "eagleeye-catalog",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-sqlsafe = { workspace = true }
eagleeye-catalog = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
