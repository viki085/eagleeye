[project]
name = "eagleeye-agent-worker"
version = "0.1.0"
description = "Celery agent worker: executes agent runs (queue `agent`)"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-llm",
    "eagleeye-retrieval",
    "eagleeye-events",
    "eagleeye-agents",
    "eagleeye-catalog",
    "eagleeye-sandbox",
    "celery[redis]>=5.4",
    "asyncpg>=0.30",
    "qdrant-client>=1.13,<1.14",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-llm = { workspace = true }
eagleeye-retrieval = { workspace = true }
eagleeye-events = { workspace = true }
eagleeye-agents = { workspace = true }
eagleeye-catalog = { workspace = true }
eagleeye-sandbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_worker"]
