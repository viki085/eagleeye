[project]
name = "eagleeye-ingest-worker"
version = "0.1.0"
description = "Celery ingest worker: scan -> parse -> chunk -> embed -> dual-store upsert"
requires-python = ">=3.12"
dependencies = [
    "eagleeye-core",
    "eagleeye-llm",
    "eagleeye-retrieval",
    "celery[redis]>=5.4",
    "asyncpg>=0.30",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "fpdf2>=2.8",
]

[tool.uv.sources]
eagleeye-core = { workspace = true }
eagleeye-llm = { workspace = true }
eagleeye-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest_worker"]
